<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: var(--canvas); font-family: var(--font); color: var(--ink); overflow: hidden; }
        #ev-copy { position: absolute; left: 130px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
        #ev-title { margin: 0; font-size: 84px; font-weight: 650; letter-spacing: -.04em; line-height: 1.04; }
        #ev-title .w:nth-last-child(-n+2) { color: var(--accent); }
        #ev-count { margin: 0; font-size: 28px; font-weight: 600; color: var(--muted); }
        #ev-shot { position: absolute; left: 740px; top: 190px; width: 1014px; height: 728px; }
        #ev-img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 18px; box-shadow: 0 40px 90px rgba(31, 36, 48, .16), 0 0 0 1px var(--line); }
        #ev-scan { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, rgba(91, 63, 217, 0), rgba(91, 63, 217, .16)); border-bottom: 2px solid var(--accent); opacity: 0; }
        .finding { position: absolute; border: 3px solid var(--ey); border-radius: 6px; box-shadow: 0 0 0 1px rgba(31, 36, 48, .55), 0 0 22px rgba(255, 230, 0, .55); opacity: 0; }
        .ev-label { position: absolute; width: 330px; background: #FFFFFF; border: 1px solid var(--line); border-left: 4px solid var(--ey); border-radius: 12px; padding: 12px 16px; box-shadow: 0 16px 34px rgba(31, 36, 48, .14); opacity: 0; }
        .ev-axis { margin: 0 0 6px; display: flex; justify-content: space-between; gap: 10px; font-size: 15px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
        .ev-kind { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); background: var(--canvas); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
        .ev-kind.measured { color: var(--accent); background: var(--accent-soft); }
        .ev-text { margin: 0; font-size: 20px; font-weight: 500; line-height: 1.3; color: var(--ink); }
      </style>
      <div id="root" data-composition-id="evidence" data-scale="1.3" data-width="1920" data-height="1080">
        <div id="ev-copy">
          <h2 id="ev-title">Chaque constat, sa preuve.</h2>
          <p id="ev-count">5 constats · chacun relié à son élément</p>
        </div>
        <div id="ev-shot">
          <img id="ev-img" src="assets/w3c-bad-citylights.jpg" alt="Capture de la démonstration Avant/Après du W3C (version inaccessible)" />
          <div id="ev-scan"></div>
          <div class="finding" id="ev-f0" data-sfx="13.2" style="left: 813.8px; top: 42.9px; width: 188.5px; height: 24.7px;"></div>
          <div class="finding" id="ev-f1" data-sfx="13.9" style="left: 227.5px; top: 187.2px; width: 564.2px; height: 89.7px;"></div>
          <div class="finding" id="ev-f2" data-sfx="14.6" style="left: 0.0px; top: 189.8px; width: 201.5px; height: 182.0px;"></div>
          <div class="finding" id="ev-f3" data-sfx="15.3" style="left: 825.5px; top: 193.7px; width: 135.2px; height: 20.8px;"></div>
          <div class="finding" id="ev-f4" data-sfx="16.0" style="left: 234.0px; top: 633.1px; width: 62.4px; height: 20.8px;"></div>
          <div class="ev-label" id="ev-l0" style="left: 804px; top: -97px;">
            <p class="ev-axis">Utilisabilité<span class="ev-kind">Revue d’expert</span></p>
            <p class="ev-text">Le menu rapide est une liste déroulante sans libellé ni bouton Valider</p>
          </div>
          <div class="ev-label" id="ev-l1" style="left: 228px; top:  47px;">
            <p class="ev-axis">Design visuel<span class="ev-kind">Revue d’expert</span></p>
            <p class="ev-text">Trois styles typographiques concurrents dans une même colonne</p>
          </div>
          <div class="ev-label" id="ev-l2" style="left: 0px; top: 382px;">
            <p class="ev-axis">Navigation<span class="ev-kind">Revue d’expert</span></p>
            <p class="ev-text">Le menu n’indique pas la page en cours</p>
          </div>
          <div class="ev-label" id="ev-l3" style="left: 804px; top: 225px;">
            <p class="ev-axis">Accessibilité<span class="ev-kind measured">Mesuré · axe-core</span></p>
            <p class="ev-text">Contraste de 3,88:1, 4,5:1 requis</p>
          </div>
          <div class="ev-label" id="ev-l4" style="left: 234px; top: 664px;">
            <p class="ev-axis">Contenu<span class="ev-kind">Revue d’expert</span></p>
            <p class="ev-text">Les liens « MORE » n’indiquent pas leur destination</p>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        // Finding reveal times (local); the music track places a tick on each (see index.html audio, Task 7).
        const at = [1.2, 1.9, 2.6, 3.3, 4.0];
        revealWords(tl, document.getElementById("ev-title"), .1);
        tl.fromTo("#ev-count", { opacity: 0 }, { opacity: 1, duration: .5 }, .6);
        tl.fromTo("#ev-shot", { opacity: 0, y: 140, rotationX: 22, rotationY: -10, transformPerspective: 1800, transformOrigin: "50% 100%" },
          { opacity: 1, y: 0, rotationX: 0, rotationY: 0, duration: .9, ease: "power3.out" }, 0);
        tl.fromTo("#ev-scan", { opacity: 0, y: -120 }, { opacity: 1, y: 608, duration: at[4] - .7, ease: "none" }, .8);
        tl.to("#ev-scan", { opacity: 0, duration: .25 }, at[4] + .1);
        at.forEach((t, i) => {
          tl.fromTo(`#ev-f${i}`, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: .35, ease: "back.out(2)" }, t);
          tl.fromTo(`#ev-l${i}`, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: .4, ease: "power3.out" }, t + .08);
        });
        tl.to("#ev-shot", { scale: 1.5, opacity: 0, filter: "blur(8px)", duration: .3, ease: "power2.in" }, 4.7);
        tl.to("#ev-copy", { opacity: 0, x: -40, duration: .3, ease: "power2.in" }, 4.7);
        window.__timelines["evidence"] = tl;
      </script>
    </template>
  </body>
</html>
