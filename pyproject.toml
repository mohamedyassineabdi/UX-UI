[project]
name = "pfe-ux-ui-auditor"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "Appium-Python-Client==5.1.3",
  "beautifulsoup4==4.12.3",
  "httpx==0.27.0",
  "lxml==5.2.2",
  "openpyxl==3.1.5",
  "pillow==11.3.0",
  "playwright==1.43.0",
  "pydantic==2.7.1",
  "python-dotenv==1.2.2",
  "requests==2.32.5",
  "selenium==4.32.0",
  "typing-extensions==4.15.0",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
