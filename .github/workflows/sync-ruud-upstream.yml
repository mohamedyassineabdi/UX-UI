name: One-time upstream integration (branch only)

on:
  push:
    branches:
      - feat/codex-cli-audit-backend
    paths:
      - .github/workflows/sync-ruud-upstream.yml

permissions:
  contents: write

jobs:
  merge_source:
    runs-on: ubuntu-latest
    if: github.repository == 'mohamedyassineabdi/UX-UI' && github.ref == 'refs/heads/feat/codex-cli-audit-backend'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge pinned source repository main into development branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/codex-cli-audit-backend"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add source https://github.com/Ruudgullit1920/UX-UI.git
          git fetch --no-tags source main
          test "$(git rev-parse FETCH_HEAD)" = "be87d4f5372d35e071970c6debba0d6e805e7cc7"
          git merge --no-edit --no-ff -X theirs FETCH_HEAD -m "merge: upstream Ruudgullit1920/UX-UI main into Codex development branch"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "Source: $(git rev-parse FETCH_HEAD)"
          git push origin HEAD:refs/heads/feat/codex-cli-audit-backend
