name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and smoke checks
    # Playwright 1.43's supported Linux browser dependency set targets Jammy.
    # Keep this browser gate on that reproducible runner rather than tracking
    # the moving ubuntu-latest image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the locked environment
        run: |
          python -m pip install uv==0.9.28
          uv sync --frozen
          npm ci --ignore-scripts
      - name: Build the production frontend
        run: |
          npm run build
          ! rg -n "unpkg\\.com/(react|react-dom|gsap)" src/ui/static/app
      - name: Install Chromium for website browser E2E
        run: uv run python -m playwright install --with-deps chromium
      - name: Run website browser E2E
        run: uv run pytest -q tests/test_website_browser_e2e.py
      - name: Run tests
        run: uv run pytest -q
      - name: Compile project modules
        run: uv run python -m compileall src figma_audit navigator scripts
      - name: Smoke-import major components
        run: |
          uv run python -c "import src"
          uv run python -c "import figma_audit"
          uv run python -c "import navigator.crawler"
          uv run python -c "import src.ui.server"
          uv run python -c "import src.security.network_policy"

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history with Gitleaks
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.28.0
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  docker:
    name: Docker image gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --pull=false -t ux-ui-auditor-ci .
      - name: Verify image security settings
        run: |
          test "$(docker image inspect ux-ui-auditor-ci --format '{{.Config.User}}')" = "auditor"
          test "$(docker image inspect ux-ui-auditor-ci --format '{{if .Config.Healthcheck}}configured{{end}}')" = "configured"
          docker run --rm ux-ui-auditor-ci sh -c '! grep -R "unpkg.com/react\\|unpkg.com/react-dom\\|unpkg.com/gsap" /app/src/ui/static/app'
